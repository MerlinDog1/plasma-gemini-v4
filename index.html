<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL2 Plasma Shader</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script type="x-shader/x-vertex" id="vs">#version 300 es
in vec2 a_position;
void main() { gl_Position = vec4(a_position, 0.0, 1.0); }
    </script>
    <script type="x-shader/x-fragment" id="fs">#version 300 es
precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
out vec4 outColor;
void main() {
    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
    float time = u_time * 0.5;
    float v = 0.0;
    vec2 c = uv * 10.0 - 5.0;
    v += sin(c.x + time);
    v += sin((c.y + time) * 0.5);
    v += sin((c.x + c.y + time) * 0.5);
    c += 5.0 * vec2(sin(time / 3.0), cos(time / 2.0));
    v += sin(sqrt(c.x*c.x + c.y*c.y + 1.0) + time);
    v = v / 2.0;
    vec3 purple = vec3(0.5, 0.0, 0.5);
    vec3 cyan = vec3(0.0, 1.0, 1.0);
    vec3 col = mix(purple, cyan, sin(v * 3.14159) * 0.5 + 0.5);
    float pulse = sin(u_time) * 0.2 + 0.8;
    col *= pulse;
    outColor = vec4(col, 1.0);
}
    </script>
    <script>
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2');
function createShader(gl, type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(shader)); gl.deleteShader(shader); return null;
    }
    return shader;
}
const vsSource = document.getElementById('vs').text.trim();
const fsSource = document.getElementById('fs').text.trim();
const vs = createShader(gl, gl.VERTEX_SHADER, vsSource);
const fs = createShader(gl, gl.FRAGMENT_SHADER, fsSource);
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
gl.useProgram(program);
const positions = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);
const loc = gl.getAttribLocation(program, 'a_position');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ut = gl.getUniformLocation(program, 'u_time');
const ur = gl.getUniformLocation(program, 'u_resolution');
function resize() { canvas.width = innerWidth; canvas.height = innerHeight; gl.viewport(0,0,canvas.width,canvas.height); }
window.addEventListener('resize', resize); resize();
const start = performance.now();
(function loop() {
    gl.uniform1f(ut, (performance.now()-start)/1000);
    gl.uniform2f(ur, canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 6);
    requestAnimationFrame(loop);
})();
    </script>
</body>
</html>
